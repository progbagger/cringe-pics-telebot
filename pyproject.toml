[project]
name = "cringe-pics-telebot"
version = "0.1.0"
description = "Some bot that sends cringe pictures."
authors = [{ name = "Danil Astakhov", email = "thrixstudio@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiogram>=3.30.0",
  "aiohttp>=3.14.3",
  "asyncpg>=0.31.0",
  "click>=8.4.2",
  "redis[hiredis]>=8.1.0",
  "serpyco-rs>=1.21.0",
  "sqlalchemy[asyncio]>=2.1.0b3",
]

[project.scripts]
bot = "cringe_pics_telebot.cli:poll"

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/cringe_pics_telebot"]

[tool.mypy]
exclude = ["^alembic/"]

[dependency-groups]
migration = [
  "alembic>=1.17.2",
]
dev = [
  "dotenv>=0.9.9",
  "mypy>=2.3.0",
  "pre-commit>=4.6.2",
  "pyhamcrest>=2.1.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.16.2",
]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
