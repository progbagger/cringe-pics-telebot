[project]
name = "cringe-pics-telebot"
version = "0.1.0"
description = "Some bot that sends cringe pictures."
authors = [{ name = "Danil Astakhov", email = "thrixstudio@yandex.ru" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiogram[proxy]>=3.31.0",
  "aiohttp>=3.14.5",
  "asyncpg>=0.32.0",
  "av>=19.0.2",
  "click>=8.5.0",
  "numpy>=2.5.4",
  "pillow>=13.0.0",
  "redis[hiredis]>=8.1.0",
  "serpyco-rs>=1.23.0",
  "sqlalchemy[asyncio]>=2.1.6",
  "statsd>=4.0.1",
]

[project.scripts]
bot = "cringe_pics_telebot.cli:poll"

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/cringe_pics_telebot"]

[tool.mypy]
exclude = ["^alembic/"]

[dependency-groups]
migration = [
  "alembic>=1.20.1",
]
dev = [
  "dotenv>=0.9.9",
  "mypy>=2.4.0",
  "pre-commit>=4.7.0",
  "pyhamcrest>=2.1.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.1",
  "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "statsd"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type", "misc"]
